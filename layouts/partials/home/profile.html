<article data-nebula-home class="home-intro flex flex-col items-center justify-center text-center">
  <header class="relative px-1 py-1 flex flex-col items-center mb-3">
    {{ with .Site.Params.homepage.profileImage }}
      <img
        class="mb-2 h-36 w-36 rounded-full"
        width="144"
        height="144"
        alt="{{ $.Site.Params.Author.name | default `Author` }}"
        loading="eager"
        fetchpriority="high"
        src="{{ . }}"
        data-zoom-src="{{ . }}">
    {{ end }}
    <h1 class="text-4xl font-extrabold">
      {{ .Site.Params.Author.name | default .Site.Title }}
    </h1>
    {{ with .Site.Params.Author.headline }}
      <h2 class="text-xl text-neutral-700 dark:text-neutral-300">
        {{ . | markdownify }}
      </h2>
    {{ end }}
    <div class="mt-1 text-2xl">
      {{ partialCached "author-links.html" . }}
    </div>
  </header>
  <section class="prose dark:prose-invert w-full">{{ .Content }}</section>
</article>
